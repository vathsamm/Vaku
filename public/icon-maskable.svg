<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="mBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#140f2b"/>
      <stop offset="100%" stop-color="#240c47"/>
    </linearGradient>
    <linearGradient id="mAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="mGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed background for maskable compliance -->
  <rect width="512" height="512" fill="url(#mBgGrad)"/>

  <!-- Centered within 80% safe zone circle (410px diameter centered at 256,256) -->
  <g transform="translate(131, 105) scale(0.83)">
    <!-- Film Outer Frame -->
    <rect x="0" y="0" width="300" height="230" rx="36" fill="#0d1120" stroke="url(#mAccentGrad)" stroke-width="8" />
    
    <!-- Film Perforations -->
    <rect x="24" y="16" width="28" height="20" rx="6" fill="#8b5cf6" opacity="0.9"/>
    <rect x="76" y="16" width="28" height="20" rx="6" fill="#8b5cf6" opacity="0.9"/>
    <rect x="128" y="16" width="28" height="20" rx="6" fill="#8b5cf6" opacity="0.9"/>
    <rect x="180" y="16" width="28" height="20" rx="6" fill="#8b5cf6" opacity="0.9"/>
    <rect x="232" y="16" width="28" height="20" rx="6" fill="#8b5cf6" opacity="0.9"/>

    <rect x="24" y="194" width="28" height="20" rx="6" fill="#06b6d4" opacity="0.9"/>
    <rect x="76" y="194" width="28" height="20" rx="6" fill="#06b6d4" opacity="0.9"/>
    <rect x="128" y="194" width="28" height="20" rx="6" fill="#06b6d4" opacity="0.9"/>
    <rect x="180" y="194" width="28" height="20" rx="6" fill="#06b6d4" opacity="0.9"/>
    <rect x="232" y="194" width="28" height="20" rx="6" fill="#06b6d4" opacity="0.9"/>

    <!-- Play/Cut symbol -->
    <path d="M 120 70 L 210 115 L 120 160 Z" fill="url(#mAccentGrad)" filter="url(#mGlow)"/>
    <path d="M 120 70 L 210 115 L 120 160 Z" fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- Typography safely within safe zone -->
  <text x="256" y="360" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="46" fill="#ffffff" text-anchor="middle" letter-spacing="3">
    VD <tspan fill="url(#mAccentGrad)">STUDIO</tspan>
  </text>
  <text x="256" y="395" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" fill="#9ca3af" text-anchor="middle" letter-spacing="5">
    OFFLINE VIDEO
  </text>
</svg>
