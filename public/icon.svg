<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#140f2b"/>
      <stop offset="100%" stop-color="#240c47"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base App Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Ambient Glow Behind Icon -->
  <circle cx="256" cy="240" r="140" fill="#a855f7" opacity="0.18" filter="url(#glow)"/>

  <!-- Film Reel / Play Frame Icon -->
  <g transform="translate(106, 85)">
    <!-- Film Border Outer Frame -->
    <rect x="0" y="0" width="300" height="230" rx="36" fill="#0d1120" stroke="url(#accentGrad)" stroke-width="7" />
    
    <!-- Top & Bottom Film Sprocket Perforations -->
    <rect x="24" y="16" width="28" height="20" rx="6" fill="#8b5cf6" opacity="0.85"/>
    <rect x="76" y="16" width="28" height="20" rx="6" fill="#8b5cf6" opacity="0.85"/>
    <rect x="128" y="16" width="28" height="20" rx="6" fill="#8b5cf6" opacity="0.85"/>
    <rect x="180" y="16" width="28" height="20" rx="6" fill="#8b5cf6" opacity="0.85"/>
    <rect x="232" y="16" width="28" height="20" rx="6" fill="#8b5cf6" opacity="0.85"/>

    <rect x="24" y="194" width="28" height="20" rx="6" fill="#06b6d4" opacity="0.85"/>
    <rect x="76" y="194" width="28" height="20" rx="6" fill="#06b6d4" opacity="0.85"/>
    <rect x="128" y="194" width="28" height="20" rx="6" fill="#06b6d4" opacity="0.85"/>
    <rect x="180" y="194" width="28" height="20" rx="6" fill="#06b6d4" opacity="0.85"/>
    <rect x="232" y="194" width="28" height="20" rx="6" fill="#06b6d4" opacity="0.85"/>

    <!-- Central Cut / Play Triangle Symbol -->
    <path d="M 120 70 L 210 115 L 120 160 Z" fill="url(#accentGrad)" filter="url(#glow)"/>
    <path d="M 120 70 L 210 115 L 120 160 Z" fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- VD STUDIO Bold Brand Typography -->
  <text x="256" y="385" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    VD <tspan fill="url(#accentGrad)">STUDIO</tspan>
  </text>
  <text x="256" y="425" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="19" fill="#9ca3af" text-anchor="middle" letter-spacing="6">
    OFFLINE VIDEO PRO
  </text>
</svg>
